<a class="card{{#unless available}} off{{/unless}}" href="{{url}}" data-name="{{search}}" data-color="{{color}}" data-ripen="{{ripen}}" data-type="{{type}}" data-avail="{{#if available}}1{{else}}0{{/if}}">
      <div class="ph">{{#if hasImage}}<img src="{{cover.src}}"{{#if cover.srcset}} srcset="{{cover.srcset}}" sizes="(max-width: 640px) 50vw, 300px"{{/if}} width="{{cover.w}}" height="{{cover.h}}" alt="{{cover.alt}}">{{else}}<span class="noimg {{colorClass}}" role="img" aria-label="Sorta {{name}}, fotografija još nije dodata">{{name}}</span>{{/if}}<span class="dot {{colorClass}}"></span></div>
      <div class="cb"><h3>{{name}}</h3><p class="cline">{{line}}</p>{{#if small}}<small>{{small}}</small>{{/if}}</div>
    </a>
