# Netlify: build i zaglavlja.
# Stranice su u folderima s index.html, pa čisti URL-ovi i završna kosa crta
# ne trebaju posebna podešavanja.

[build]
  command = "node build/build.mjs --db"
  publish = "dist"

# CSS i JS imaju heš sadržaja u imenu, pa smiju biti immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/build.json"
  [headers.values]
    Cache-Control = "no-cache"

# Panel nije za pretraživače.
[[headers]]
  for = "/panel/*"
  [headers.values]
    X-Robots-Tag = "noindex"
